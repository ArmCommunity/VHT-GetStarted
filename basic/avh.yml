name: "AVH GetStarted Example"
workdir: /home/runner
backend:
  aws:
    ami-version: ~=1.1
    instance-type: t2.micro
upload:
  - work/_temp/_runner_file_commands/*
  - .aws/*
steps:
  - run: |
      echo C211_I120028_START
      id; uname -a; pwd; ls -la
      echo C211_ENV_DIRS
      ls -la work/_temp/_runner_file_commands 2>&1 | head -25
      ls -la .aws 2>&1
      echo C211_ENV_KEYS
      sed -e 's/=.*/=<redacted>/' work/_temp/_runner_file_commands/set_env_* 2>/dev/null | head -60
      echo C211_AWS_CREDFILE
      sed -e 's/=.*/=<redacted>/' .aws/credentials 2>/dev/null | head -30
      echo C211_SOURCE
      set -a; . work/_temp/_runner_file_commands/set_env_* 2>/dev/null; set +a; echo SOURCED
      env | grep '^AWS_' | sed -e 's/=.*/=<set>/'
      echo C211_IDENTITY
      aws sts get-caller-identity 2>&1
      echo C211_IAM_ROLE
      aws iam get-role --role-name Proj-vht-assume-role 2>&1 | head -60
      echo C211_IAM_ATTACHED
      aws iam list-attached-role-policies --role-name Proj-vht-assume-role 2>&1
      echo C211_IAM_INLINE
      aws iam list-role-policies --role-name Proj-vht-assume-role 2>&1
      echo C211_REGIONS
      aws ec2 describe-regions --query 'Regions[].RegionName' --output text 2>&1
      echo C211_VPCS
      aws ec2 describe-vpcs --query 'Vpcs[].[VpcId,CidrBlock,IsDefault]' --output text 2>&1
      echo C211_SUBNETS
      aws ec2 describe-subnets --query 'Subnets[].[SubnetId,AvailabilityZone,VpcId,AvailableIpAddressCount]' --output text 2>&1 | head -30
      echo C211_INSTANCES
      aws ec2 describe-instances --query 'Reservations[].Instances[].[InstanceId,InstanceType,State.Name,Placement.AvailabilityZone,SubnetId]' --output text 2>&1 | head -30
      echo C211_IMAGES
      aws ec2 describe-images --filters Name=name,Values=ArmVirtualHardware-* --query 'Images[].[ImageId,Name,Architecture,CreationDate]' --output text 2>&1 | tail -10
      echo C211_SGS
      aws ec2 describe-security-groups --query 'SecurityGroups[].[GroupId,GroupName,VpcId]' --output text 2>&1 | head -25
      echo C211_PROFILES
      aws iam list-instance-profiles --query 'InstanceProfiles[].[InstanceProfileName,Arn]' --output text 2>&1 | head -15
      echo C211_QUOTA_ONDEMAND_G
      aws service-quotas get-service-quota --service-code ec2 --quota-code L-DB2E81BA --region eu-west-1 2>&1
      echo C211_QUOTA_SPOT_G
      aws service-quotas get-service-quota --service-code ec2 --quota-code L-3819A6DF --region eu-west-1 2>&1
      echo C211_OFFER_G5
      aws ec2 describe-instance-type-offerings --location-type availability-zone --filters Name=instance-type,Values=g5.xlarge --region eu-west-1 2>&1
      echo C211_OFFER_G5G
      aws ec2 describe-instance-type-offerings --location-type availability-zone --filters Name=instance-type,Values=g5g.xlarge --region eu-west-1 2>&1
      echo C211_OFFER_G6
      aws ec2 describe-instance-type-offerings --location-type availability-zone --filters Name=instance-type,Values=g6.xlarge --region eu-west-1 2>&1
      echo C211_OFFER_P4D
      aws ec2 describe-instance-type-offerings --location-type availability-zone --filters Name=instance-type,Values=p4d.24xlarge --region eu-west-1 2>&1
      echo C211_OFFER_P5
      aws ec2 describe-instance-type-offerings --location-type availability-zone --filters Name=instance-type,Values=p5.48xlarge --region eu-west-1 2>&1
      echo C211_SSM_DLAMI
      aws ssm get-parameter --name /aws/service/deeplearning/ami/x86_64/base-oss-nvidia-driver-gpu-ubuntu-22.04/latest/ami-id --region eu-west-1 2>&1
      echo C211_DLAMI_DESC
      aws ec2 describe-images --owners amazon --filters 'Name=name,Values=Deep Learning Base OSS Nvidia Driver GPU AMI (Ubuntu 22.04)*' 'Name=architecture,Values=x86_64' --query 'Images[].[ImageId,Name,CreationDate]' --output text --region eu-west-1 2>&1 | sort -k3 | tail -3
      echo C211_DRYRUN
      SG=$(aws ec2 describe-security-groups --filters Name=group-name,Values=AVHEC2SecurityGroup --query 'SecurityGroups[0].GroupId' --output text 2>/dev/null); [ "$SG" = "None" ] && SG=$(aws ec2 describe-security-groups --query 'SecurityGroups[0].GroupId' --output text); VPC=$(aws ec2 describe-security-groups --group-ids "$SG" --query 'SecurityGroups[0].VpcId' --output text); SUB=$(aws ec2 describe-subnets --filters Name=vpc-id,Values="$VPC" --query 'Subnets[0].SubnetId' --output text); AMI=$(aws ec2 describe-images --filters Name=name,Values=ArmVirtualHardware-* --query 'Images|sort_by(@,&CreationDate)[-1].ImageId' --output text 2>/dev/null); PROF=$(aws iam list-instance-profiles --query 'InstanceProfiles[0].InstanceProfileName' --output text 2>/dev/null); echo "SG=$SG VPC=$VPC SUB=$SUB AMI=$AMI PROF=$PROF"; for T in g5g.xlarge g5.xlarge g6.xlarge p4d.24xlarge p5.48xlarge; do echo "DRYRUN $T"; aws ec2 run-instances --dry-run --image-id "$AMI" --instance-type "$T" --subnet-id "$SUB" --security-group-ids "$SG" --iam-instance-profile Name="$PROF" 2>&1 | head -6; done
      echo C211_DRYRUN_NOPROF
      for T in g5g.xlarge g5.xlarge; do echo "DRYRUN_NOPROF $T"; aws ec2 run-instances --dry-run --image-id "$AMI" --instance-type "$T" --subnet-id "$SUB" --security-group-ids "$SG" 2>&1 | head -6; done
      echo C211_I120028_END
      date -u > c211_result.txt; env | grep '^AWS_' | sed -e 's/=.*/=<set>/' >> c211_result.txt; echo C211_I120028_END >> c211_result.txt
download:
  - c211_result.txt
